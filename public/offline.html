<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spritz</title>
<!--
  Offline screen for the native shell (slice 8, D26). Capacitor shows this
  file (server.errorPath in capacitor.config.ts) when the webview cannot
  load spritzofficial.app. It is bundled into the app at `cap sync`, so it
  renders with no network at all. Everything is inline: no fonts, no
  images, no requests. Georgia stands in for Playfair, system sans for
  Roboto, colours are the globals.css tokens verbatim.
-->
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; min-height: 100%; background: #F4EFE6; color: #1A1A1A; }
  body {
    font: 300 15px/1.5 -apple-system, "Helvetica Neue", Roboto, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: calc(24px + env(safe-area-inset-top, 0px)) 32px calc(24px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box; text-align: center;
  }
  .mark { font: 400 44px/1 Georgia, "Playfair Display", "Times New Roman", serif; color: #1F3F2E; letter-spacing: -0.01em; margin-bottom: 40px; }
  h1 { font: 400 22px/1.25 Georgia, "Playfair Display", serif; margin: 0 0 8px; }
  p { margin: 0; color: #6B6960; max-width: 26ch; }
  button {
    margin-top: 32px; height: 44px; padding: 0 24px; border: 0; border-radius: 0;
    background: #1F3F2E; color: #F4EFE6; font: 400 15px -apple-system, Roboto, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { opacity: .85; }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true">spritz</div>
  <h1>You’re offline.</h1>
  <p>Spritz needs a connection to look things up.</p>
  <button type="button" onclick="location.replace('https://spritzofficial.app/')">Try again</button>
</body>
</html>
