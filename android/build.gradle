// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Build output lives outside OneDrive. OneDrive locks files it is
    // syncing, and Gradle then fails to delete its own intermediates
    // (AccessDeniedException / "Unable to delete directory"). The signed
    // bundle wizard still copies app-release.aab to android/app/release.
    def localRoot = System.getenv("LOCALAPPDATA") ?: System.getProperty("java.io.tmpdir")
    layout.buildDirectory.set(new File(localRoot, "spritz-gradle-build/${project.path == ':' ? 'root' : project.name}"))
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
